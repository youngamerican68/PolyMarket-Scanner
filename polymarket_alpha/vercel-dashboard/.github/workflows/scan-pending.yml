# .github/workflows/scan-pending.yml
# Re-scans pending longshot wallets to capture positions once they meet the $2,500 threshold
# Runs every hour
#
# Required GitHub Secrets:
# - CRON_SECRET: Bearer token for job endpoint authentication
# - DOMAIN: Production domain (e.g., poly-market-scanner.vercel.app)

name: Scan Pending Wallets

on:
  schedule:
    # Run every hour at minute 30
    - cron: '30 * * * *'
  workflow_dispatch:
    # Allow manual triggering for testing

jobs:
  scan-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scan pending longshot wallets
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::error::DOMAIN secret is not set"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi

          echo "Running scan-pending job at https://$DOMAIN/api/jobs/scan-pending"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://$DOMAIN/api/jobs/scan-pending")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::scan-pending returned HTTP $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

          echo "$BODY" | jq .

          # Extract metrics
          PENDING=$(echo "$BODY" | jq -r '.pendingWalletsFound // 0')
          SCANNED=$(echo "$BODY" | jq -r '.walletsScanned // 0')
          INSERTED=$(echo "$BODY" | jq -r '.positionsInserted // 0')
          CAPTURED=$(echo "$BODY" | jq -r '.walletsCaptured // 0')

          echo ""
          echo "Summary:"
          echo "  Pending wallets found: $PENDING"
          echo "  Wallets scanned: $SCANNED"
          echo "  Positions inserted: $INSERTED"
          echo "  Wallets captured: $CAPTURED"
