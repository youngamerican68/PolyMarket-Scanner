{% extends "base.html" %}

{% block title %}{{ report_date }} Report - Polymarket Alpha{% endblock %}

{% block extra_head %}
<style>
    .markdown-content h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #2a2a2a;
    }
    .markdown-content h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-top: 2rem;
        margin-bottom: 1rem;
        color: #00d26a;
    }
    .markdown-content h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
    }
    .markdown-content p {
        margin-bottom: 0.75rem;
        line-height: 1.6;
    }
    .markdown-content ul {
        list-style: disc;
        margin-left: 1.5rem;
        margin-bottom: 1rem;
    }
    .markdown-content li {
        margin-bottom: 0.25rem;
    }
    .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
    }
    .markdown-content th {
        background: #2a2a2a;
        padding: 0.75rem;
        text-align: left;
        font-weight: 600;
    }
    .markdown-content td {
        padding: 0.75rem;
        border-bottom: 1px solid #2a2a2a;
    }
    .markdown-content tr:hover td {
        background: #1f1f1f;
    }
    .markdown-content hr {
        border: none;
        border-top: 1px solid #2a2a2a;
        margin: 2rem 0;
    }
    .markdown-content strong {
        color: #ffffff;
    }
    .markdown-content code {
        background: #2a2a2a;
        padding: 0.125rem 0.375rem;
        border-radius: 4px;
        font-family: monospace;
    }

    /* Position cards styling */
    .position-won { border-left: 3px solid #00d26a; }
    .position-lost { border-left: 3px solid #ff4757; }
    .position-active { border-left: 3px solid #ffc107; }
</style>
{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Back Button -->
    <a href="/reports" class="inline-flex items-center text-poly-muted hover:text-white transition">
        <span class="mr-2">←</span> Back to Reports
    </a>

    <!-- Report Header -->
    <div class="bg-poly-card border border-poly-border rounded-lg p-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold">Top 10 Trader Report</h1>
                <p class="text-poly-green text-lg mt-1">{{ report_date }}</p>
            </div>
            <a href="/reports/{{ filename }}/raw" target="_blank"
               class="bg-poly-border hover:bg-poly-muted/30 px-4 py-2 rounded-lg text-sm transition">
                View Raw Markdown
            </a>
        </div>
    </div>

    <!-- Report Content -->
    <div class="bg-poly-card border border-poly-border rounded-lg p-6">
        <div class="markdown-content">
            {{ content | safe }}
        </div>
    </div>
</div>
{% endblock %}
