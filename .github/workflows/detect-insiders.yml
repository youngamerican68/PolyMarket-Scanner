name: Detect Insiders

on:
  schedule:
    # Runs every 15 minutes. Detection lag is acceptable — we're verifying
    # via external API and persisting for the dashboard, not pushing alerts.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detect-insiders
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run insider detector
        env:
          DETECT_INSIDERS_URL: ${{ secrets.DETECT_INSIDERS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DETECT_INSIDERS_URL" ]; then
            echo "ERROR: DETECT_INSIDERS_URL is empty"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET is empty"
            exit 1
          fi

          echo "Target host: $(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ.get("DETECT_INSIDERS_URL","")).netloc)')"

          CURL_EXIT=0
          HTTP_RESPONSE=$(curl --silent --show-error --write-out "\nHTTPSTATUS:%{http_code}" \
            --max-time 300 \
            --retry 2 --retry-delay 5 \
            -X GET "$DETECT_INSIDERS_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Cache-Control: no-store") || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl failed with exit code $CURL_EXIT"
            exit 1
          fi

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTPSTATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status code: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success!"
            exit 0
          else
            echo "Request failed with status $HTTP_STATUS"
            exit 1
          fi
