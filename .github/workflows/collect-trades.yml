name: Collect Trades

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-trades
  cancel-in-progress: false  # Data collection should complete, not be interrupted

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: polymarket_alpha/vercel-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: polymarket_alpha/vercel-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run collect-trades with job_runs logging
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          COLLECT_TRADES_URL: ${{ secrets.COLLECT_TRADES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Fail fast if required secrets are missing
          if [ -z "$POSTGRES_URL" ]; then
            echo "ERROR: POSTGRES_URL secret is empty"
            exit 1
          fi
          if [ -z "$COLLECT_TRADES_URL" ]; then
            echo "ERROR: COLLECT_TRADES_URL secret is empty"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET secret is empty"
            exit 1
          fi

          # DB connectivity sanity check (prints host + db, never secrets)
          npx tsx scripts/gha-job-logger.ts sanity-check

          # Start job run (capture ID from stdout)
          JOB_RUN_ID="$(npx tsx scripts/gha-job-logger.ts start collect-trades)"
          echo "Job run started: $JOB_RUN_ID"

          # Trap to ensure job run is finished on exit (success or error)
          on_exit() {
            local exit_code=$?
            # Skip finish if start never succeeded (JOB_RUN_ID empty)
            if [ -z "${JOB_RUN_ID:-}" ]; then
              exit $exit_code
            fi
            if [ $exit_code -eq 0 ]; then
              npx tsx scripts/gha-job-logger.ts finish "$JOB_RUN_ID" success || true
            else
              npx tsx scripts/gha-job-logger.ts finish "$JOB_RUN_ID" error "collect-trades failed (exit $exit_code)" || true
            fi
          }
          trap on_exit EXIT

          # Log target host (without exposing full URL) for audit
          echo "Target host: $(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ.get("COLLECT_TRADES_URL","")).netloc)')"

          # Make request and capture both status code and body
          CURL_EXIT=0
          HTTP_RESPONSE=$(curl --silent --show-error --write-out "\nHTTPSTATUS:%{http_code}" \
            --max-time 90 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "$COLLECT_TRADES_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}') || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl failed with exit code $CURL_EXIT"
            exit 1
          fi

          # Extract body and status code
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTPSTATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status code: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          # Handle different status codes
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success!"
            exit 0
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Job already running (409 Conflict) - this is OK, advisory lock prevented overlap"
            exit 0
          else
            echo "Request failed with status $HTTP_STATUS"
            exit 1
          fi
