name: Collect Trades

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-trades
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger collect-trades
        env:
          COLLECT_TRADES_URL: ${{ secrets.COLLECT_TRADES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f --show-error --silent \
            --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "$COLLECT_TRADES_URL" \
            -H "x-cron-secret: $CRON_SECRET"
