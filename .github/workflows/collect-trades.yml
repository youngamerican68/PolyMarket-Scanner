name: Collect Polymarket Trades

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polymarket_alpha/vercel-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: polymarket_alpha/vercel-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Collect trades
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npx tsx scripts/collect-trades.ts
