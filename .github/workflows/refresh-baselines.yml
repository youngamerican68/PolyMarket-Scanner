name: Refresh Baselines

on:
  schedule:
    # Run daily at 2 AM UTC (after midnight US Eastern)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-baselines
  cancel-in-progress: false  # Baseline computation should complete, not be interrupted

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh wallet trade baselines
        env:
          REFRESH_BASELINES_URL: ${{ secrets.REFRESH_BASELINES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fail fast if URL secret is missing
          if [ -z "$REFRESH_BASELINES_URL" ]; then
            echo "ERROR: REFRESH_BASELINES_URL is empty"
            exit 1
          fi

          # Log target host (without exposing full URL) for audit
          echo "Target host: $(python3 -c "import os; from urllib.parse import urlparse; print(urlparse(os.environ.get('REFRESH_BASELINES_URL','')).netloc)")"

          # Make request and capture both status code and body
          HTTP_RESPONSE=$(curl --silent --show-error --write-out "HTTPSTATUS:%{http_code}" \
            --max-time 300 \
            --retry 2 --retry-delay 10 \
            -X GET "$REFRESH_BASELINES_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Cache-Control: no-store")

          # Extract body and status code
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTPSTATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status code: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          # Handle different status codes
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success!"
            exit 0
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Job already running (409 Conflict) - this is OK, advisory lock prevented overlap"
            exit 0
          else
            echo "Request failed with status $HTTP_STATUS"
            exit 1
          fi
