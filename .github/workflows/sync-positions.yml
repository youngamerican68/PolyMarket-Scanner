name: Sync Positions

on:
  schedule:
    # Run every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-positions
  cancel-in-progress: false  # Position sync should complete, not be interrupted

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync positions from Polymarket API
        env:
          SYNC_POSITIONS_URL: ${{ secrets.SYNC_POSITIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Make request and capture both status code and body
          HTTP_RESPONSE=$(curl --silent --write-out "HTTPSTATUS:%{http_code}" \
            --max-time 120 \
            --retry 2 --retry-delay 5 \
            -X POST "$SYNC_POSITIONS_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Cache-Control: no-store" \
            -H "Content-Type: application/json")

          # Extract body and status code
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTPSTATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status code: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          # Handle different status codes
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success!"
            exit 0
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Job already running (409 Conflict) - this is OK, advisory lock prevented overlap"
            exit 0
          else
            echo "Request failed with status $HTTP_STATUS"
            exit 1
          fi
